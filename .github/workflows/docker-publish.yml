name: Docker image

# Publikacja na GHCR wyłącznie po wydaniu wersji (tag git vX.Y.Z).
# Push na main i pull requesty tylko sprawdzają, czy obraz się buduje (amd64, bez publikacji).
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
      - ".env.example"
      - ".github/dependabot.yml"
      - "LICENSE"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python - kompilacja
        run: python -m py_compile orange_rabat.py orange_login.py

      - name: Shell - shellcheck
        run: shellcheck docker-entrypoint.sh

      - name: Compose - walidacja
        run: |
          docker compose -f docker-compose.yaml config --quiet
          docker compose -f docker-compose.yaml -f docker-compose.build.yaml config --quiet

  build:
    name: Build & push
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Logowanie do GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadane obrazu
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest = najnowsze wydanie (flavor latest=auto); wersje przedpremierowe (v1.0.0-rc.1) go nie dostają
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=auto-morange
            org.opencontainers.image.description=Automatyczny comiesięczny odbiór rabatu w Mój Orange (Playwright + cron)
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          annotations: |
            org.opencontainers.image.title=auto-morange
            org.opencontainers.image.description=Automatyczny comiesięczny odbiór rabatu w Mój Orange (Playwright + cron)
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: Build & push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PUSH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Atestacja pochodzenia (SLSA)
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
